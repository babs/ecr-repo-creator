name: "Release"

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REPOS: "ghcr.io/babs/kaniko-w-ecr-repo-creator"

jobs:
  build-image:
    name: "Build OCI image"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    outputs:
      RAW_IMG_TAGS: ${{ steps.define-targets.outputs.RAW_IMG_TAGS }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Define TARGETS
        id: define-targets
        run: |
          PLATFORM=${{ matrix.platform }}
          PLATFORM_PAIR=${PLATFORM//\//-}
          echo "PLATFORM_PAIR=$PLATFORM_PAIR" | tee -a $GITHUB_OUTPUT >> $GITHUB_ENV

          IMG_TAGS="latest"

          if [ ${GITHUB_REF_TYPE:-} == 'tag' -a -n "$(echo $GITHUB_REF_NAME | grep -iE '^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$')" ]; then
            TAG=${GITHUB_REF_NAME#v}
            RELEASE=""
            case "$TAG" in
              *-*)
                RELEASE="-${TAG#*-}"
                ;;
            esac
            SEMVER_CORE="${TAG%%-*}"
            IMG_TAGS="${IMG_TAGS} $TAG ${SEMVER_CORE%.*}${RELEASE} ${SEMVER_CORE%%.*}${RELEASE}"
          fi
          echo RAW_IMG_TAGS="$IMG_TAGS" | tee -a $GITHUB_OUTPUT >> $GITHUB_ENV

          echo "Targets:"
          TARGETS=""
          for REPO in $REPOS; do
            for IMG_TAG in $IMG_TAGS; do
              TARGETS="${TARGETS},${REPO}:${IMG_TAG}-$PLATFORM_PAIR"
              echo "- ${REPO}:${IMG_TAG}-$PLATFORM_PAIR"
            done
          done
          echo TARGETS=${TARGETS#,} | tee -a $GITHUB_OUTPUT >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          push: true
          tags: ${{ env.TARGETS }}
          platforms: ${{ matrix.platform }}
          # SLSA provenance + SBOM → each build pushes an OCI INDEX, so
          # merge-images must use `docker buildx imagetools` (not `docker manifest`).
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          echo "✅ Docker image created:" | tee -a $GITHUB_STEP_SUMMARY
          for TGT in ${TARGETS//,/\ }; do
            echo " - $TGT" | tee -a $GITHUB_STEP_SUMMARY
          done

  merge-images:
    name: "Merge platform images into one"
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write          # keyless cosign, only this job holds it

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --metadata-file on imagetools create needs a recent buildx.
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Merge, sign and tag the multi-arch index
        # imagetools (not `docker manifest`): per-platform builds carry
        # provenance/sbom as an OCI index; imagetools merges them and keeps
        # the attestations.
        env:
          IMG_TAGS: ${{ needs.build-image.outputs.RAW_IMG_TAGS }}
          ISSUER: https://token.actions.githubusercontent.com
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          # Merge once, from the run's most specific tag (the full version on a tag run):
          # `latest-linux-*` is shared with dispatch runs and can be moved under us.
          read -ra TAGS <<< "$IMG_TAGS"
          SRC=${TAGS[1]:-${TAGS[0]}}
          for REPO in $REPOS; do
            # imagetools needs a tag to push to. Scratch tag, moved every run: never deploy it.
            docker buildx imagetools create --metadata-file "$RUNNER_TEMP/index.json" \
              -t "$REPO:unsigned-staging" \
              "$REPO:$SRC-linux-amd64" \
              "$REPO:$SRC-linux-arm64"
            DIGEST=$(jq -re '."containerimage.descriptor".digest' "$RUNNER_TEMP/index.json")
            # --recursive also signs each platform image: without it a pull by
            # platform digest has no signature.
            cosign sign --yes --recursive "${REPO}@${DIGEST}"
            cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "${REPO}@${DIGEST}" >/dev/null
            # Public tags move only after the signature verifies.
            for IMG_TAG in $IMG_TAGS; do
              docker buildx imagetools create -t "$REPO:$IMG_TAG" "${REPO}@${DIGEST}"
              GOT=$(docker buildx imagetools inspect "$REPO:$IMG_TAG" --format '{{json .Manifest}}' | jq -r .digest)
              [[ "$GOT" == "$DIGEST" ]] || { echo "::error::$REPO:$IMG_TAG is $GOT, not the signed $DIGEST"; exit 1; }
              echo "signed $REPO:$IMG_TAG @ $DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done

  create-binaries:
    name: "Create binaries"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        run: ./release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries
          path: dist/

  create-release:
    name: "Create release"
    needs: [merge-images, create-binaries]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the GitHub Release + upload assets
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries
          path: dist/
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --clobber dist/*
